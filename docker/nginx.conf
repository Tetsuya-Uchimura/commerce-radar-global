worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Checkout query strings and order IDs must not enter access logs.
    access_log off;
    server_tokens off;
    sendfile on;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Re-resolve the backend after a container recreation / address change.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8080;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 1m;
        add_header X-Content-Type-Options nosniff always;

        location /api/ {
            set $backend backend:8000;
            proxy_pass http://$backend$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            # Origin, Cookie, Set-Cookie and X-Commerce-Radar pass unchanged.
            proxy_read_timeout 120s;
            proxy_connect_timeout 5s;
        }
        location /assets/ { try_files $uri =404; }
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }
    }
}
